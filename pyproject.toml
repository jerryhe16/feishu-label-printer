[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-label-printer"
version = "0.2.0"
description = "Print Feishu Base row labels on a locally connected Zebra ZPL printer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "reportlab>=4,<5", "qrcode>=7.4,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "zxing-cpp>=2.2,<4"]

[project.scripts]
feishu-label-printer = "feishu_label_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feishu_label_printer = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
